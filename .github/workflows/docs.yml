# Build the Sphinx docs and publish them to GitHub Pages.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: docs

on:
  push:
    branches: [main]
    paths: ["src/**", "docs/**", "pyproject.toml", "uv.lock", ".github/workflows/docs.yml"]
  workflow_dispatch: # allow a manual run from the Actions tab

permissions:
  contents: read
  pages: write # publish to Pages
  id-token: write # prove to Pages that this workflow is allowed to deploy

concurrency: # never run two deploys at once; the newest wins
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies (incl. Sphinx from the dev group)
        run: uv sync --locked --no-group notebook

      - name: Build HTML (warnings are errors)
        run: uv run sphinx-build -b html -W --keep-going docs docs/_build/html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
