[project]
name = "landgraph"
version = "0.1.0"
description = "Data pipelines that bring public UK land and planning data into **PostgreSQL/PostGIS**, and a small **FastAPI** service that answers the question - what do we know about this piece of land?"
readme = "README.md"
authors = [
    { name = "AkshatDev", email = "akshat.thakur8@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "asgi-correlation-id>=5.0.1",
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "polars>=2.1.0",
    "psycopg[binary]>=3.3.6",
    "python-json-logger>=4.2.0",
    "sqlalchemy>=2.1.6",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "sphinx>=9.2.0",
    "sphinx-immaterial>=0.13.9",
]
notebook = [
    "ipykernel>=7.4.0",
    "nbstripout>=0.9.1",
]
